services:
  # Bandeja de correo de pruebas: ver correos en http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    ports:
      - "8025:8025"
      - "1025:1025" # SMTP, necesario para que ms-notificaciones lo alcance

  ms-notificaciones:
    build: .
    container_name: ms-notificaciones
    restart: unless-stopped
    depends_on:
      - mailpit
    # Sin ports: no expone HTTP (es worker, no tiene Tomcat)
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m"
      # --- RabbitMQ (consumo) ---
      RABBITMQ_HOST: rabbit1
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      # --- Correo: en local usamos Mailpit, no Postmark ---
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
      MAIL_SMTP_AUTH: "false"
      MAIL_STARTTLS: "false"
      MAIL_FROM: no-reply@ticketfilms.local

networks:
  default:
    name: ticketfilms-net
    external: true
