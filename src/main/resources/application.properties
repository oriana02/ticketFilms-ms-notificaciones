spring.application.name=ms-notificaciones

# ==========================================
# Configuración de correo con Postmark
# ==========================================
spring.mail.host=smtp.postmarkapp.com
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
app.mail.from=${MAIL_FROM}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# El puerto 8080 local lo usa el API Manager (8084 para notificaciones)
server.port=${SERVER_PORT:8084}

# ==========================================
# RabbitMQ (Solo consumo)
# ==========================================
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# ACK manual: lo confirma ProcesadorAck después de procesar bien (o de mandar a la DLQ)
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.prefetch=1