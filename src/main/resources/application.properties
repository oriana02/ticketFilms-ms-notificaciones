spring.application.name=ms-notificaciones


# Configuración de correo con Postmark
spring.mail.host=smtp.postmarkapp.com
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
app.mail.from=${MAIL_FROM}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# El puerto 8080 local lo usa el API Manager
server.port=${SERVER_PORT:8084}

# Resource Server: valida el JWT emitido por Cognito
spring.security.oauth2.resourceserver.jwt.issuer-uri=${COGNITO_ISSUER_URI}

# Grupo de Cognito autorizado para usar /api/admin/**
app.admin.group=${ADMIN_GROUP:admin}

# ----- RabbitMQ -----
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
# ACK manual: lo confirma ProcesadorAck después de procesar bien (o de mandar a la DLQ)
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.prefetch=1
# API de gestión (para listar colas y exchanges en la API admin)
app.rabbit.management-url=${RABBITMQ_MANAGEMENT_URL:http://localhost:15672}
# true = un listener consume las DLQ y deja el contexto del fallo en el log.
# false = los mensajes fallidos quedan visibles en la consola de RabbitMQ (útil para la demo)
app.rabbit.dlq-listener=${DLQ_LISTENER:true}
